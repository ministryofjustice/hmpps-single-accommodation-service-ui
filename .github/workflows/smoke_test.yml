name: SAS UI Smoke test

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke_test:
    name: "SAS Smoke test 🔥"
    runs-on: [ self-hosted, hmpps-github-actions-runner ]

    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # Repository is specified to run the workflow from the SAS API repository
          repository: 'ministryofjustice/hmpps-single-accommodation-service-ui'
          persist-credentials: 'false'

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      #      - name: SLSA
      #        uses: ministryofjustice/devsecops-actions/sca/slsa@4cd163be7859cd130800d6719d925318826038ea

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Run Smoke Test
        env:
          E2E_BASE_URL: 'https://single-accommodation-service-dev.hmpps.service.justice.gov.uk'
          SAS_E2E_PROBATION_USER_USERNAME: ${{ secrets.E2E_USER_SAS_USER_PP_USERNAME }}
          SAS_E2E_PROBATION_USER_PASSWORD: ${{ secrets.E2E_USER_SAS_USER_PP_PASSWORD }}
        run: npm run test:e2e:smoke

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SAS-smoke-test-playwright-report
          path: test_results/e2e/report
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Smoke test artefacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SAS-smoke-test-artefacts
          path: test_results/e2e/artefacts
          retention-days: 30
          if-no-files-found: ignore

  smoke_test_notify_slack:
    name: "Smoke test failure notification"
    needs: smoke_test
    if: ${{ always() && needs.smoke_test.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        uses: ministryofjustice/hmpps-approved-premises-ui/.github/actions/slack_failure_notification@d03ccce7b908369b59e77cb4ce13468dbe6e278a # v1
        with:
          title: "SAS Smoke test"
          job: "smoke_test"
          channel_id: ${{ vars.SECURITY_ALERTS_SLACK_CHANNEL_ID }}
          slack_bot_token: ${{ secrets.HMPPS_SRE_SLACK_BOT_TOKEN }}
