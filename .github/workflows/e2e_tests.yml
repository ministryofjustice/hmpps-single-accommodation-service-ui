name: SAS UI E2E tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  e2e_test:
    name: "SAS E2E Tests 🧪"
    runs-on: [ self-hosted, hmpps-github-actions-runner ]
    strategy:
      fail-fast: false
      # Add to the matrix to start splitting the tests across multiple shards
      matrix:
        shard: [1]
    env:
      TZ: Europe/London

      # URLs
      AUTH_URL: https://sign-in-dev.hmpps.service.justice.gov.uk
      DELIUS_URL: https://ndelius.test.probation.service.justice.gov.uk
      OASYS_URL: https://t2.oasys.service.justice.gov.uk/eor/f?p=100:101
      PRISON_API: https://prison-api-dev.prison.service.justice.gov.uk

      # Credentials
      DELIUS_USERNAME: ${{ secrets.E2E_DELIUS_USERNAME }}
      DELIUS_PASSWORD: ${{ secrets.E2E_DELIUS_PASSWORD }}
      OASYS_USERNAME_BOOKING: ${{ secrets.E2E_OASYS_USERNAME_BOOKING }}
      OASYS_PASSWORD_BOOKING: ${{ secrets.E2E_OASYS_PASSWORD_BOOKING }}
      DPS_USERNAME: ${{ secrets.E2E_DPS_USERNAME }}
      HMPPS_AUTH_CLIENT_ID: ${{ secrets.E2E_HMPPS_AUTH_CLIENT_ID }}
      HMPPS_AUTH_CLIENT_SECRET: ${{ secrets.E2E_HMPPS_AUTH_CLIENT_SECRET }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Repository is specified so this workflow can be run from another repository
          repository: 'ministryofjustice/hmpps-single-accommodation-service-ui'
          persist-credentials: 'false'

      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'

#      - name: SLSA
#        uses: ministryofjustice/devsecops-actions/sca/slsa@4cd163be7859cd130800d6719d925318826038ea

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Setup data
        run: npm run test:e2e:data:setup

      - name: Parse setup output to environment
        id: setup-data
        run: |
          outputFile=tmp/TEST_ENV.txt
          [ -f $outputFile ] && cat "$outputFile" >> "$GITHUB_ENV" || true

      - name: Run E2E Tests
        env:
          E2E_BASE_URL: 'https://single-accommodation-service-dev.hmpps.service.justice.gov.uk'
          SAS_E2E_PROBATION_USER_USERNAME: ${{ secrets.E2E_SAS_E2E_PROBATION_USER_USERNAME }}
          SAS_E2E_PROBATION_USER_PASSWORD: ${{ secrets.E2E_SAS_E2E_PROBATION_USER_PASSWORD }}
          SAS_E2E_BASE_CASE_NAME: ${{ env.BASE_CASE_NAME }}
          SAS_E2E_CRS_URL: https://find-and-refer-intervention-dev.hmpps.service.justice.gov.uk
        run: npm run test:e2e:dev -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Teardown data
        if: always()
        run: npm run test:e2e:data:teardown

      - name: Publish E2E test report
        if: ${{ !cancelled() }}
        uses: ctrf-io/github-test-reporter@dbb08957b5b2af918b39136ab2c5532002c7649b # v1
        with:
          report-path: './test_results/e2e/ctrf/*.json'
          summary-report: true
          fail-rate-report: true
          flaky-rate-report: true
          upload-artifact: true
          fetch-previous-results: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SAS-E2E-playwright-report-${{ matrix.shard }}-of-${{ strategy.job-total }}
          path: test_results/e2e/report
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload E2E artefacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SAS-E2E-artefacts-${{ matrix.shard }}-of-${{ strategy.job-total }}
          path: test_results/e2e/artefacts
          retention-days: 30
          if-no-files-found: ignore

  e2e_test_notify_slack:
    name: "E2E test failure notification"
    needs: e2e_test
    if: ${{ always() && needs.e2e_test.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download CTRF test report
        id: download_ctrf
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ctrf-report
          path: ctrf-report
      - name: Send Slack notification
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.HMPPS_SRE_SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SECURITY_ALERTS_SLACK_CHANNEL_ID }}
          BRANCH_NAME: ${{ github.ref_name }}
        with:
          script: |
            const fs = require('fs')

            const THREAD_THRESHOLD = 10

            const reportPath = 'ctrf-report/ctrf-report.json'
            let failedCount = 0
            let entries = []

            if (fs.existsSync(reportPath)) {
              const { results } = JSON.parse(fs.readFileSync(reportPath, 'utf8'))
              const failed = (results.tests || []).filter((test) => test.status === 'failed')

              failedCount = results.summary?.failed ?? failed.length

              const byName = new Map()
              for (const test of failed) {
                if (!byName.has(test.name)) {
                  byName.set(test.name, test.message)
                }
              }
              entries = [...byName.entries()].map(([name, message]) => ({ name, message }))
            }

            const truncate = (message, maxLength) => {
              if (!message) return ''
              const firstLine = message.split('\n')[0].trim()
              return firstLine.length > maxLength ? `${firstLine.slice(0, maxLength)}…` : firstLine
            }

            const formatEntry = (entry) => {
              const reason = truncate(entry.message, 150)
              return reason ? `• ${entry.name}\n   _${reason}_` : `• ${entry.name}`
            }

            const bulletList = (list) => list.map(formatEntry).join('\n')

            const useThread = entries.length > THREAD_THRESHOLD
            const failedTestsText =
              entries.length === 0
                ? 'Unknown'
                : useThread
                  ? `${failedCount} tests failed - see thread for the full list`
                  : bulletList(entries)

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const repoUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`
            const testLabel = failedCount === 1 ? 'test' : 'tests'

            const payload = {
              channel: process.env.SLACK_CHANNEL_ID,
              text: `Failed: SAS E2E Tests (${failedCount} ${testLabel} failed) - ${runUrl}`,
              blocks: [
                {
                  type: 'header',
                  text: {
                    type: 'plain_text',
                    text: `:red_circle: SAS E2E Tests failed (${failedCount} ${testLabel})`,
                    emoji: true,
                  },
                },
                {
                  type: 'section',
                  fields: [
                    { type: 'mrkdwn', text: `*Workflow:*\n<${runUrl}|${context.workflow}>` },
                    { type: 'mrkdwn', text: `*Branch:*\n${process.env.BRANCH_NAME}` },
                    { type: 'mrkdwn', text: `*Repository:*\n<${repoUrl}|${context.repo.owner}/${context.repo.repo}>` },
                    { type: 'mrkdwn', text: `*Triggered by:*\n${context.actor}` },
                  ],
                },
                {
                  type: 'section',
                  text: { type: 'mrkdwn', text: `*Failed tests:*\n${failedTestsText}` },
                },
              ],
              unfurl_links: false,
              unfurl_media: false,
            }

            const response = await fetch('https://slack.com/api/chat.postMessage', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json; charset=utf-8',
                Authorization: `Bearer ${process.env.SLACK_BOT_TOKEN}`,
              },
              body: JSON.stringify(payload),
            })

            const result = await response.json()
            if (!result.ok) {
              core.setFailed(`Slack notification failed: ${result.error}`)
            } else if (useThread) {
              const chunks = []
              let chunk = []
              let chunkLength = 0
              for (const entry of entries) {
                const line = formatEntry(entry)
                if (chunkLength + line.length > 2900 && chunk.length > 0) {
                  chunks.push(chunk)
                  chunk = []
                  chunkLength = 0
                }
                chunk.push(line)
                chunkLength += line.length + 1
              }
              if (chunk.length > 0) chunks.push(chunk)

              for (const [index, chunkLines] of chunks.entries()) {
                const heading = index === 0 ? `*Failed tests (${entries.length}):*\n` : ''
                const threadResponse = await fetch('https://slack.com/api/chat.postMessage', {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json; charset=utf-8',
                    Authorization: `Bearer ${process.env.SLACK_BOT_TOKEN}`,
                  },
                  body: JSON.stringify({
                    channel: process.env.SLACK_CHANNEL_ID,
                    thread_ts: result.ts,
                    text: `${heading}${chunkLines.join('\n')}`,
                  }),
                })

                const threadResult = await threadResponse.json()
                if (!threadResult.ok) {
                  core.setFailed(`Slack thread reply failed: ${threadResult.error}`)
                  break
                }
              }
            }
