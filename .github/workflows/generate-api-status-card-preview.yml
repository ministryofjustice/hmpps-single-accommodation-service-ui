name: Generate API Status Card Preview HTML

on:
  workflow_run:
    workflows: ['Pipeline [test -> build -> deploy]']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ui_run_id:
        description: Successful UI main pipeline run ID containing the preview artifact
        required: true
        type: string

permissions:
  contents: read

jobs:
  trigger-api-preview:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: [self-hosted, hmpps-github-actions-runner]
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: generate-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            hmpps-single-accommodation-service-api

      - name: Trigger API Status Card Preview Workflow
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          UI_RUN_ID: ${{ github.event.workflow_run.id || inputs.ui_run_id }}
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const runId = process.env.UI_RUN_ID;
            if (!/^[1-9]\d*$/.test(runId)) {
              throw new Error('A valid UI pipeline run ID is required');
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: 'hmpps-single-accommodation-service-api',
              workflow_id: 'update-status-card-preview.yml',
              ref: 'main',
              inputs: { ui_run_id: runId }
            })
