generic-service:
  nameOverride: hmpps-single-accommodation-service-ui
  productId: 'HMPPS554' # productId for the product that this belongs too, i.e. DPS001, see README.md for details

  # the IRSA service account name for accessing AWS resources
  serviceAccountName: "hmpps-single-accommodation-service-account"

  replicaCount: 4

  image:
    repository: ghcr.io/ministryofjustice/hmpps-single-accommodation-service-ui
    tag: app_version # override at deployment time
    port: 3000

  ingress:
    enabled: true
    host: app-hostname.local # override per environment
    tlsSecretName: hmpps-single-accommodation-service-cert

  livenessProbe:
    httpGet:
      path: /ping

  readinessProbe:
    httpGet:
      path: /ping

  # Environment variables to load into the deployment
  env:
    NODE_ENV: 'production'
    # Enable Node's environment proxy support for Cloud Platform's HTTP(S)_PROXY and NO_PROXY variables.
    NODE_USE_ENV_PROXY: '1'
    APPLICATION_INSIGHTS_NO_STATSBEAT: 'true'
    REDIS_ENABLED: 'true'
    REDIS_TLS_ENABLED: 'true'
    TOKEN_VERIFICATION_ENABLED: 'true'
    AUDIT_SQS_REGION: 'eu-west-2'
    AUDIT_SERVICE_NAME: 'hmpps-single-accommodation-service-ui'
    LOG_LEVEL: 'info'
    MAINTENANCE_MODE: 'false'
    HIDE_MANUAL_ADDRESS_ENTRY: 'true'

  # Pre-existing kubernetes secrets to load as environment variables in the deployment.
  # namespace_secrets:
  #   [name of kubernetes secret]:
  #     [name of environment variable as seen by app]: [key of kubernetes secret to load]

  namespace_secrets:
    # These secrets are created by terraform.
    # Keep the name aligned with the egress-controls module's default resource_name_prefix.
    hmpps-envoy-https-proxy-env:
      HTTP_PROXY: 'HTTP_PROXY'
      HTTPS_PROXY: 'HTTPS_PROXY'
      NO_PROXY: 'NO_PROXY'
      http_proxy: 'http_proxy'
      https_proxy: 'https_proxy'
      no_proxy: 'no_proxy'
    hmpps-single-accommodation-service-ui-client-creds:
      CLIENT_CREDS_CLIENT_ID: 'CLIENT_CREDS_CLIENT_ID'
      CLIENT_CREDS_CLIENT_SECRET: 'CLIENT_CREDS_CLIENT_SECRET'
    hmpps-single-accommodation-service-ui-auth-code:
      AUTH_CODE_CLIENT_ID: 'AUTH_CODE_CLIENT_ID'
      AUTH_CODE_CLIENT_SECRET: 'AUTH_CODE_CLIENT_SECRET'
    hmpps-single-accommodation-service-ui-session-secret:
      SESSION_SECRET: 'SESSION_SECRET'
    elasticache-redis:
      REDIS_HOST: 'primary_endpoint_address'
      REDIS_AUTH_TOKEN: 'auth_token'
    hmpps-single-accommodation-service-ui-application-insights:
      APPLICATIONINSIGHTS_CONNECTION_STRING: "APPLICATIONINSIGHTS_CONNECTION_STRING"
    hmpps-single-accommodation-service-ui:
      OS_DATAHUB_API_KEY: 'OS_DATAHUB_API_KEY'
      SENTRY_DSN: 'SENTRY_DSN'

  allowlist:
    groups:
      - digital_staff_and_mojo
      - moj_cloud_platform

generic-prometheus-alerts:
  targetApplication: hmpps-single-accommodation-service-ui
